[general]
live_config_reload = true

[font]
size = 8.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[keyboard]

[[keyboard.bindings]]
key = "0"
mods = "Control"
action = "None"

[[keyboard.bindings]]
key = "="
mods = "Control"
action = "None"

[[keyboard.bindings]]
key = "-"
mods = "Control"
action = "None"

[window]

[window.dimensions]
columns = 190
lines = 90
